[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not agent"
markers =
    gate: backend starts, routes registered, auth basics
    security: user isolation and RLS invariants (zero tolerance)
    logic: pure logic, no network
    api: needs the Supabase test project
    agent: calls a real LLM (slow, uses quota); run on purpose with: pytest -m agent
